# runs are executed in the same order as in this file
# the second field tells which test should be run in order to compare with the last available output
# see regtest/TEST_FILES
#
"HeH-water-noconstraint.inp"            = [{matcher="E_total", tol=2e-11, ref=-2.95332848940707}]
# The MM part seems to introduce noise that is difficult to account for
# So just running the test successfully is sufficient
"HeH-water-cdft-state-1.inp"            = []
"HeH-water-cdft-state-2.inp"            = []
# These tests compute the electronic coupling in parallel/serial modes
# The CDFT constraint is deliberately loosely converged (EPS_SCF 3.0e-1 in
# becke_qs.inc), so the charge transfer energy is not fully converged and is
# prone to run-to-run noise (~1e-6 to 1e-5). Tolerances below are loosened
# accordingly.
"HeH-water-mixed-cdft-1.inp"            = [{matcher="M075", tol=1e-5, ref=-0.144751419978}]
"HeH-water-mixed-cdft-2.inp"            = [{matcher="M075", tol=1e-5, ref=-0.144751419978}]
# MD tests in parallel/serial modes
"HeH-water-mixed-cdft-3.inp"            = [{matcher="M011", tol=1e-09, ref=-2.564762048165651}]
"HeH-water-mixed-cdft-4.inp"            = [{matcher="M011", tol=2e-09, ref=-2.564762048183066}]
#EOF
