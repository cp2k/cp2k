# Three OT steps exercise LDA/GGA energies and orbital updates; not SCF references.
# PBE covers spin exchange and cancellation against stored high-spin references.
"O2-pade.inp"              = [{matcher = "E_total", tol = 1e-11, ref = -144.2487583930717}]
"O2-pbe.inp"               = [{matcher = "E_total", tol = 1e-11, ref = -145.14330654999202}]
"O2-pbe-spinflip.inp"      = [{matcher = "E_total", tol = 1e-11, ref = -145.14330654999193}]
"O2-pbe-cancel.inp"        = [{matcher = "E_total", tol = 1e-11, ref = -145.16079497283638}]
# Restart files must preserve shared orbitals; tiny OT steps isolate this behavior.
"O2-pbe-restart-write.inp" = [{matcher = "E_total", tol = 1e-10, ref = -141.15493130591946}]
"O2-pbe-restart-read.inp"  = [{matcher = "E_total", tol = 1e-10, ref = -141.1549376514416}]
