# Collinear spins: two alpha Wannier functions and one beta Wannier function.
# The k-point SCF supplies two bands to each channel; beta therefore disentangles.
# Beta spread tolerance accounts for independent SCF convergence and MPI/OpenMP roundoff.
# Spreads include the corrected clipped-spin PBE derivatives from #6161.
# The pre-#6161 PBE routine recovers the previous references in a controlled comparison;
# these values agree across one/two ranks and with standalone Wannier90 4.0.2.
# Same-Hamiltonian MO reconstruction is also checked by VALIDATE_REUSE_SCF_MOS.
# The first test supplies the shared SCF restart; subsequent variants do not overwrite it.
"li_both.inp" = [{matcher="WANNIER90_LIBRARY_ALPHA_SPREAD", tol=1e-8, ref=13.7267532337080},
                 {matcher="WANNIER90_LIBRARY_BETA_SPREAD", tol=1e-7, ref=0.4512731356630},
                 {matcher="WANNIER90_SCF_MO_REUSE", tol=0.0, ref=1.0}]
# Independently diagonalized full mesh and the historical MP_GRID path.
"li_reference.inp" = [{matcher="WANNIER90_LIBRARY_ALPHA_SPREAD", tol=1e-8, ref=13.7267532337080},
                      {matcher="WANNIER90_LIBRARY_BETA_SPREAD", tol=1e-7, ref=0.4512731356630}]
"li_mp_grid.inp" = [{matcher="WANNIER90_LIBRARY_ALPHA_SPREAD", tol=1e-8, ref=13.7267532337080},
                    {matcher="WANNIER90_LIBRARY_BETA_SPREAD", tol=1e-7, ref=0.4512731356630}]
# Selecting a single channel must select its corresponding repeated Wannier count.
"li_alpha.inp" = [{matcher="WANNIER90_LIBRARY_ALPHA_SPREAD", tol=1e-8, ref=13.7267532337080},
                  {matcher="WANNIER90_SCF_MO_REUSE", tol=0.0, ref=1.0}]
"li_beta.inp" = [{matcher="WANNIER90_LIBRARY_BETA_SPREAD", tol=1e-7, ref=0.4512731356630},
                 {matcher="WANNIER90_SCF_MO_REUSE", tol=0.0, ref=1.0}]
# Gamma-only SCF has unequal MO dimensions: two alpha bands but one beta band.
"li_gamma.inp" = [{matcher="WANNIER90_LIBRARY_ALPHA_SPREAD", tol=1e-8, ref=14.0287439120682},
                  {matcher="WANNIER90_LIBRARY_BETA_SPREAD", tol=1e-8, ref=0.4625520797232}]
