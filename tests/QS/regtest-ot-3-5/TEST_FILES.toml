# runs are executed in the same order as in this file
# the second field tells which test should be run in order to compare with the last available output
# e.g. 0 means do not compare anything, running is enough
#      1 compares the last total energy in the file
#      for details see cp2k/tools/do_regtest
"Al-kpoint-mermin-response.inp"         = [
  {matcher="E_total", tol=1e-9, ref=-3.995032366510561},
  {matcher="OT_mermin_response_update"},
]
"Al-kpoint-mermin-response-lbfgs.inp"   = [
  {matcher="E_total", tol=1e-9, ref=-3.990589661470200},
  {matcher="OT_mermin_lbfgs_response_update"},
]
"Al-kpoint-mermin-md.inp"              = [
  {matcher="M_INIT_ENERGY", tol=1e-8, ref=-3.959232525340075},
  {matcher="M_CONS_QTY", tol=1e-8, ref=-3.95874105061},
]
"Al-kpoint-mermin-geo-opt.inp"         = [{matcher="E_total", tol=1e-8, ref=-3.95942279154558}]
"Al-kpoint-mermin-cell-opt.inp"        = [{matcher="E_total", tol=1e-8, ref=-2.08597923726350}]
#EOF
