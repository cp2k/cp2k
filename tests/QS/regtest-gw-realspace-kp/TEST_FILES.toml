# Periodic full-k RI-RS GW: SCF mesh and a separate Gamma-X band path. Tests 09 and 10 use the
# numerical d_lP computation, all others the analytic one (chosen automatically).
"09_RIRS_G0W0_PBE_periodic_H2.inp"              = [
  {matcher = "E_RIRS_HOMO", tol = 1e-4, ref = -4.503},
  {matcher = "E_RIRS_LUMO", tol = 1e-4, ref = 19.107},
  {matcher = "E_G0W0_indirect_gap", tol = 1e-4, ref = 23.610},
  {matcher = "E_G0W0_direct_gap", tol = 1e-4, ref = 23.699}
]
# AUTO_RI trains on the shared SCF mesh before evaluating the separate band path.
"10_RIRS_G0W0_PBE_periodic_AUTO_RI_H2.inp"      = [
  {matcher = "Auto_RI_Size", tol = 1e-12, ref = 10},
  {matcher = "E_G0W0_indirect_gap", tol = 1e-4, ref = 23.510}
]
