# runs are executed in the same order as in this file
# the second field tells which test should be run in order to compare with the last available output
# e.g. 0 means do not compare anything, running is enough
#      1 compares the last total energy in the file
#      for details see cp2k/tools/do_regtest
# Davidson diagonalization and smearing at k-points
# blocked Davidson at symmetry-reduced complex K points with fractional occupations,
# the Davidson counterpart of the STANDARD Al smearing family in regtest-kp-2
"Al-kpoint-dav-smear.inp"               = [{matcher="E_total", tol=1e-9, ref=-8.159987079852488}]
# same with the adaptive inner tolerance (EPS_ADAPT): loose early SCF steps,
# unoccupied MOS converge five times looser
"Al-kpoint-dav-smear-adapt.inp"         = [{matcher="E_total", tol=1e-9, ref=-8.159987079852488}]
# same with ADDED_MOS AUTO: the raised temperature pushes the Fermi tail onto
# the top band, so the run must grow the virtual space twice (4 -> 8 -> 16) and
# land on the energy of the fixed-count twin with 16 added MOS. Without the
# growth the energy misses the reference by 3.4E-8. The default k-point group
# split gives two single-rank groups at the two CI ranks
"Al-kpoint-dav-smear-auto.inp"          = [{matcher="E_total", tol=1e-9, ref=-8.173546695860358}]
# blocked Davidson at complex K points, same oracle energy as the OT family below
"he_dav.inp"                            = [{matcher="E_total", tol=1e-9, ref=-2.89466358139099},
                                           {matcher="N_special_kpoints", tol=0.0, ref=4}]
"he_dav_full_all.inp"                   = [{matcher="E_total", tol=1e-9, ref=-2.89466358139099},
                                           {matcher="N_special_kpoints", tol=0.0, ref=4}]
"he_dav_s_inverse.inp"                  = [{matcher="E_total", tol=1e-9, ref=-2.89466358139099},
                                           {matcher="N_special_kpoints", tol=0.0, ref=4}]
"he_dav_single_inverse.inp"             = [{matcher="E_total", tol=1e-9, ref=-2.89466358139099},
                                           {matcher="N_special_kpoints", tol=0.0, ref=4}]
# warm start from extrapolated MOS: the second geometry step consumes the
# extrapolated MOS as trial subspace instead of a cold start (PS, and ASPC below)
"he_dav_geo_opt.inp"                    = [{matcher="E_total", tol=1e-9, ref=-2.89466358072372},
                                           {matcher="N_special_kpoints", tol=0.0, ref=4}]
"he_dav_geo_opt_aspc.inp"               = [{matcher="E_total", tol=1e-9, ref=-2.89466358072372},
                                           {matcher="N_special_kpoints", tol=0.0, ref=4}]
# density-only WFN restart (the .kp file holds no MOS): the Davidson cold-starts
# on top of the restarted density
"he_dav_restart.inp"                    = [{matcher="E_total", tol=1e-9, ref=-2.89466358138925}]
# no preconditioner: every call is a single Rayleigh-Ritz rotation
"he_dav_none.inp"                       = [{matcher="E_total", tol=1e-9, ref=-2.89466358135803},
                                           {matcher="N_special_kpoints", tol=0.0, ref=4}]
"li_dav_uks.inp"                        = [{matcher="E_total", tol=1e-9, ref=-7.304793043105472},
                                           {matcher="N_special_kpoints", tol=0.0, ref=1}]
#EOF
