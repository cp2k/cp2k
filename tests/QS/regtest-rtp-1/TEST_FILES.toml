# runs are executed in the same order as in this file
# the second field tells which test should be run in order to compare with the last available output
# e.g. 0 means do not compare anything, running is enough
#      1 compares the last total energy in the file
#      for details see cp2k/tools/do_regtest
# test mulliken constraints
"H2plus-rtp.inp"        = [{matcher = "E_total", tol = 4e-10, ref = -0.52809706671521}]
"H2plus-rtp-1.inp"      = [{matcher = "E_total", tol = 4e-10, ref = -0.52809706671521}]
"H2-rtp.inp"            = [{matcher = "E_total", tol = 3e-13, ref = -0.90223968521353}]
"H2-emd.inp"            = [{matcher = "M002", tol = 1.0E-14, ref = -9.02240021135E-01}]
"H2plus-emd-1.inp"      = [{matcher = "M002", tol = 1.0E-14, ref = -6.50541655787E-01}]
"H2plus-emd.inp"        = [{matcher = "M002", tol = 1.0E-14, ref = -6.40455129463E-01}]
# H2O has real GTH nonlocal-PP projectors on O, unlike the H-only tests above,
# so these exercise the nonlocal-PP correction to the integrated RTP current.
"H2O-current-nl.inp"    = [{matcher = "RTP_current_checksum", tol = 1.0E-8, ref = 0.3605481285496976E-01}]
"H2O-current-nl-vg.inp" = [{matcher = "RTP_current_checksum", tol = 1.0E-8, ref = 0.1191796372925447E-01}]
#EOF
