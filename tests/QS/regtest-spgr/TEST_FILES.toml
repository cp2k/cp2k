# runs are executed in the same order as in this file
# the second field tells which test should be run in order to compare with the last available output
# e.g. 0 means do not compare anything, running is enough
#      93 compares with the space group number provied in the SPGR section of the output file
#      for details see cp2k/tools/do_regtest
"copper.inp"                            = [{matcher="M093", tol=0, ref=225}]
"quartz.inp"                            = [{matcher="M093", tol=0, ref=154}]
"silicon-canonical-cell-opt.inp"         = [{matcher="M093", tol=0, ref=227}]
"silicon-oriented-cell-opt.inp"          = [
  {matcher="M093", tol=0, ref=227},
  {matcher="Cell_vector_a_y", tol=1.0E-3, ref=3.868},
  {matcher="Cell_angle_alpha", tol=1.0E-10, ref=60.0},
]
#EOF
