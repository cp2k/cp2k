# M_CONS_QTY reads the final-step MD|Conserved quantity.
[M_INIT_ENERGY]
class   = 'GenericMatcher'
pattern = 'ENERGY| Total FORCE_EVAL'
col     = 9
first   = true

[M_CONS_QTY]
class   = 'GenericMatcher'
