# Spack environment file for an MPI parallel CP2K binary with all available dependencies

# Edit this file with care because it is automatically changed by the make_cp2k.sh script

spack:
  concretizer:
    unify: true

  config:
    connect_timeout: 240
    install_tree:
      padded_length: 128
      root: /opt/spack

  modules:
    prefix_inspections:
      bin:
        - PATH
      lib:
        - LD_LIBRARY_PATH
      lib64:
        - LD_LIBRARY_PATH

  packages:
    all:
      buildable: true
      prefer:
        - "~cuda"
        - "+fortran"
        - "+mpi"
        - "+mpi_f08"
        - "~opencl"
        - "+openmp"
        - "+pic"
        - "~rocm"
        - "~tests"
        - "build_system=cmake"
        - "build_type=Release"

    cuda:
      buildable: false
      externals:
        - spec: cuda@12.9
          prefix: /usr/local/cuda

    # Build tools
    cmake:
      prefer:
        - "@4"

    mpi:
      require:
        - mpich

    mpich:
      require:
        - "~xpmem"
#       - "netmod=ofi"

    xpmem:
      require:
        - "xpmem@master ~kernel-module"

    # ScaLAPACK, LAPACK, BLAS
    blas:
      require:
        - openblas

    lapack:
      require:
        - openblas

    libxs:
      require:
        - "+fortran"

    openblas:
      require:
        - "threads=openmp"
        - "build_system=makefile"

    scalapack:
      require:
        - netlib-scalapack

    # Libraries needed by CP2K
    adios2:
      require:
        - "~bzip2"
        - "~xrootd"

    cosma:
      require:
        - "~cuda ~gpu_direct"
        - "+scalapack"

    dbcsr:
      require:
        - "~examples"
        - "+openmp"
        - "smm=libxs"

    deepmdkit:
      require:
        - "+pytorch"

    dla-future:
      require:
        - "+scalapack"

    elpa:
      require:
        - "+openmp"

    fftw:
      require:
        - "+openmp"

    gauxc:
      require:
        - "+c"
        - "~cutlass"
        - "+fortran"
        - "+openmp"
        - "+skala skala_version=1.1"

    hdf5:
      require:
        - "+fortran"

    libfabric:
      require:
        - "~cuda ~gdrcopy"
#       - "fabrics=efa,ucx"

    libint:
      require:
        - "+fortran"

    libxc:
      require:
        - "~cuda"
        - "+kxc"

    mctc-lib:
      require:
        - "~openmp"

    openpmd-api:
      require:
        - "+adios2"

    pexsi:
      require:
        - "+fortran"

    py-torch:
      require:
        - "~distributed"
        - "~fbgemm"
        - "~kineto"
        - "~mkldnn"
        - "~rocm"
        - "~valgrind"
        - "~xnnpack"
        - spec: "~flash_attention"
          when: "+cuda"
        - spec: "~magma"
          when: "+cuda"

    sirius:
      require:
        - "~apps"
        - "+dftd3"
        - "+dftd4"
        - "+dlaf"
        - "+elpa"
        - "+fortran"
        - "~memory_pool"
        - "+pugixml"
        - "+scalapack"
        - "+vdwxc"

    spla:
      require:
        - "+fortran"

    # SuperLU_DIST 7 (required by PEXSI 2) does not compile with C23 (default since GCC 15)
    superlu-dist:
      require:
        - "cflags=-std=gnu17"
        - "~cuda"

    trexio:
      require:
        - "+hdf5"

    # Libfabric's UCX provider is not compatible with UCX 1.22 yet.
    ucx:
      require:
        - "@1.21.0"

    # Yasm's CMake recipe has many target-related issues.
    yasm:
      require:
        - "build_system=autotools"

  repos:
    builtin:
      commit: 4fcf009e9f80634440c461937f322a9f0510a37b # 2026-11-04

  specs:
    # Build tools
    - "cmake@3.27:"
    - "gcc@10:"
    - "gmake@4.2:"
    - "mpich@5.0.2"
    - "ninja@1.13"
#   - "openmpi@5.0.10"
    - "python@3.11:"
    # CP2K
    - "adios2@2.12.1"
    - "cosma@2.8.5"
#   - "cusolvermp@0.7.2.888"
    - "dbcsr@git.8e8c7d469419a587bd4e597c4118557632991d8e=develop"
    - "deepmdkit@3.2.0"
#   - "dftd4@4.2.0"
    - "dla-future@0.10.0"
    - "dla-future-fortran@0.5.0"
    - "elpa@2026.02.002"
    - "fftw@3.3.11"
    - "gauxc@dev20260717"
    - "greenx@2.2"
    - "hdf5@2.2.0"
    - "libfabric@2.6.0"
    - "libfci@0.1.0"
    - "libgint@release_v1"
    - "libint@2.13.1-cp2k-lmax-5"
    - "libsmeagol@1.2"
    - "libvdwxc@0.5.0"
    - "libvori@220621"
    - "libwignernj@0.8.0"
    - "libxc@7.1.2"
    - "libxs@git.cc9188afc9422fda96c9fa0199ea89c49fd78995=main"
    - "libxsmm@git.5fdf801e9c2bf91a929018ade31ebf1c24235f0a=main"
#   - "libxstream@git.b0481a7f605e216c46b540a09f01ab67680cc150=main"
    - "mimic-mcl@3.0.0"
    - "netlib-scalapack@2.2.3"
    - "openblas@0.3.34"
    - "openpmd-api@0.17.1"
    - "pace@2025.12.4.1"
    - "pexsi@2.0.0"
    - "plumed@2.10.1"
    - "py-torch@2.14.1"
    - "sirius@7.12.0"
    - "spfft@1.1.1"
    - "spglib@2.8.0"
    - "spla@1.6.1"
    - "tblite@0.8.0"
    - "trexio@2.6.1"

  view:
    default:
      root: /opt/spack/view
      exclude:
        - curl
        - gcc-runtime
        - readline
