# Spack environment file for a serial statically linked CP2K binary with all available dependencies

# Edit this file with care because it is automatically changed by the make_cp2k.sh script

spack:
  concretizer:
    unify: true

  config:
    connect_timeout: 240
    install_tree:
      padded_length: 128
      root: /opt/spack

  modules:
    prefix_inspections:
      bin:
        - PATH
      lib:
        - LD_LIBRARY_PATH
      lib64:
        - LD_LIBRARY_PATH

  packages:
    all:
      buildable: true
      prefer:
        - "~cuda"
        - "~mpi"
        - "~mpi_f08"
        - "+openmp"
        - "+pic"
        - "~rocm"
    #   - "~shared" this does not work because of gettext
        - "+static"
        - "build_type=Release"

    # Build tools
    cmake:
      prefer:
        - "@4"

    # ScaLAPACK, LAPACK, BLAS
    blas:
      require:
        - openblas

    lapack:
      require:
        - openblas

    libxs:
      require:
        - "+fortran"
        - "~shared"

    openblas:
      require:
        - "+fortran"
        - "threads=openmp"
        - "build_system=makefile"

    # Libraries needed by CP2K
    dbcsr:
      require:
        - "~examples"
        - "+openmp"
        - "~shared"
        - "smm=libxs"

    fftw:
      require:
        - "+openmp"
        - "~shared"

    hdf5:
      require:
        - "+fortran"
        - "~shared"

    libfci:
      require:
        - "~shared"

    libint:
      require:
        - "+fortran"
        - "~shared"

    libxc:
      require:
        - "+kxc"
        - "~shared"

    libwignernj:
      require:
        - "~shared"

    spglib:
      require:
        - "~shared"

    tblite:
      require:
        - "~shared"

  repos:
    builtin:
      commit: dc7929641af94e9f219e0cb5ea00274480701c87 # 2026-10-16

  specs:
    # Build tools
    - "cmake@3.27:"
    - "gcc@10:"
    - "gmake@4.2:"
    - "ninja@1.13"
    - "python@3.11:"
    # CP2K
    - "dbcsr@git.97a623c2b9b89b8781592e546bab90d8f034b947=develop"
#   - "dftd4@4.2.0"
    - "fftw@3.3.11"
#   - "hdf5@2.2.0"
    - "libfci@0.1.0"
    - "libint@2.13.1-cp2k-lmax-5"
    - "libvori@220621"
    - "libwignernj@0.8.0"
    - "libxc@7.1.2"
    - "libxs@git.930a2c4f5d7d4ee82142302e1a17812557c02dae=main"
    - "libxsmm@git.3057b239c16994d307589e40e45f40857ad5f5b8=main"
    - "openblas@0.3.34"
    - "pace@2025.12.4.1"
    - "spglib@2.8.0"
    - "tblite@0.8.0"

  view:
    default:
      root: /opt/spack/view
      exclude:
        - curl
        - gcc-runtime
        - readline
