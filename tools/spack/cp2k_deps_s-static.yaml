# Spack environment file for a serial statically linked CP2K binary with all available dependencies

# Edit this file with care because it is automatically changed by the make_cp2k.sh script

spack:
  concretizer:
    unify: true

  config:
    connect_timeout: 240
    install_tree:
      padded_length: 128
      root: /opt/spack

  modules:
    prefix_inspections:
      bin:
        - PATH
      lib:
        - LD_LIBRARY_PATH
      lib64:
        - LD_LIBRARY_PATH

  packages:
    all:
      buildable: true
      prefer:
        - "~cuda"
        - "~mpi"
        - "~mpi_f08"
        - "+openmp"
        - "+pic"
        - "~rocm"
    #   - "~shared" this does not work because of gettext
        - "+static"
        - "build_type=Release"

    # Build tools
    cmake:
      prefer:
        - "@4"

    # ScaLAPACK, LAPACK, BLAS
    blas:
      require:
        - openblas

    lapack:
      require:
        - openblas

    libxs:
      require:
        - "+fortran"
        - "~shared"

    openblas:
      require:
        - "+fortran"
        - "threads=openmp"
        - "build_system=makefile"

    # Libraries needed by CP2K
    dbcsr:
      require:
        - "~examples"
        - "+openmp"
        - "~shared"
        - "smm=libxs"

    fftw:
      require:
        - "+openmp"
        - "~shared"

    hdf5:
      require:
        - "+fortran"
        - "~shared"

    libfci:
      require:
        - "~shared"

    libint:
      require:
        - "+fortran"
        - "~shared"

    libxc:
      require:
        - "+kxc"
        - "~shared"

    libwignernj:
      require:
        - "~shared"

    spglib:
      require:
        - "~shared"

  repos:
    builtin:
      commit: 4fcf009e9f80634440c461937f322a9f0510a37b # 2026-11-04

  specs:
    # Build tools
    - "cmake@3.27:"
    - "gcc@10:"
    - "gmake@4.2:"
    - "ninja@1.13"
    - "python@3.11:"
    # CP2K
    - "dbcsr@git.8e8c7d469419a587bd4e597c4118557632991d8e=develop"
#   - "dftd4@4.2.0"
    - "fftw@3.3.11"
#   - "hdf5@2.2.0"
    - "libfci@0.1.0"
    - "libint@2.14.1-cp2k-lmax-5"
    - "libvori@220621"
    - "libwignernj@0.8.0"
    - "libxc@7.1.2"
    - "libxs@git.cc9188afc9422fda96c9fa0199ea89c49fd78995=main"
    - "libxsmm@git.5fdf801e9c2bf91a929018ade31ebf1c24235f0a=main"
    - "openblas@0.3.34"
    - "pace@2025.12.4.1"
    - "spglib@2.8.0"
    - "tblite@0.8.0"

  view:
    default:
      root: /opt/spack/view
      exclude:
        - curl
        - gcc-runtime
        - readline
