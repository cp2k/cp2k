# SPDX-License-Identifier: GPL-2.0-or-later
name: Python package release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after native validation and separate index approvals
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: python-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build and check the installed wheel
        run: bash python/tools/check_release.sh "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pycp2k-release
          path: |
            ${{ runner.temp }}/release/dist/
            ${{ runner.temp }}/release/manifest.json
            ${{ runner.temp }}/release/unit-tests.xml
          if-no-files-found: error

  testpypi:
    if: inputs.publish && github.repository == 'cp2k/cp2k' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pycp2k-release
          path: release
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: release/dist/
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    needs: testpypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pycp2k-release
          path: release
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Download and verify the TestPyPI wheel
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import json; print(json.load(open("release/manifest.json"))["version"])')
          for attempt in 1 2 3; do
            if python -m pip download --no-deps --only-binary=:all: \
              --index-url https://test.pypi.org/simple/ "pycp2k==$version" --dest candidate; then
              break
            fi
            test "$attempt" != 3 || exit 1
            sleep 5
          done
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path("release/manifest.json").read_text())
          wheels = list(Path("candidate").glob("*.whl"))
          assert len(wheels) == 1
          wheel = wheels[0]
          assert hashlib.sha256(wheel.read_bytes()).hexdigest() == manifest["sha256"][wheel.name]
          PY
          python -m pip install numpy
          python -m pip install --no-deps candidate/*.whl
          python -m pip check
          python -I - <<'PY'
          import importlib.metadata
          import sys

          import cp2k
          import cp2k.library

          assert cp2k.__version__ == importlib.metadata.version("pycp2k")
          assert cp2k.library._runtime is None
          assert "mpi4py.MPI" not in sys.modules
          PY

  pypi:
    needs: verify-testpypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pycp2k-release
          path: release
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: release/dist/
