[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cp2k-python"
version = "0.1.0"
description = "Direct, in-process Python interface to libcp2k"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
ase = ["ase>=3.23"]
aiida = ["aiida-core>=2.7,<3", "aiida-cp2k>=2.1,<3"]
mpi = ["mpi4py>=3.1"]
openmm = ["openmm>=8.6.1"]
lammps = ["lammps>=2025.7.22"]
test = ["pytest>=7", "ase>=3.23"]
typing = ["mypy==2.3.1", "ase>=3.23", "mpi4py>=3.1"]

[project.urls]
Homepage = "https://www.cp2k.org"
Repository = "https://github.com/cp2k/cp2k"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
# Upstream ASE methods are not all annotated yet.
untyped_calls_exclude = ["ase"]
# Public package entry points and ASE calculator, including imported helpers.
files = [
    "$MYPY_CONFIG_FILE_DIR/src/cp2k/__init__.py",
    "$MYPY_CONFIG_FILE_DIR/src/cp2k/ase.py",
    "$MYPY_CONFIG_FILE_DIR/tests/typing/public_api.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a real CP2K shared library or executable"]
